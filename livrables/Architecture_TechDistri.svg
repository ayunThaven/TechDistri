<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Architecture GED TechDistri niveau 2</title>
  <desc id="desc">Flux de Gmail vers n8n, Airtable, Google Drive et Airtable Interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3D8DFF"/></marker>
    <style>
      .title{font:700 46px Arial;fill:#111}.sub{font:20px Arial;fill:#5B616B}.box{fill:#EDEDED;stroke:#B8BCC4;stroke-width:2}.hot{fill:#6DCBF4;stroke:#3D8DFF;stroke-width:2}.h{font:700 28px Arial;fill:#111}.b{font:18px Arial;fill:#333}.arrow{stroke:#3D8DFF;stroke-width:8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="820" fill="#fff"/>
  <text x="70" y="85" class="title">GED TechDistri — architecture niveau 2</text>
  <text x="70" y="125" class="sub">Boîte de démonstration : techdistriesgi@gmail.com · Polling toutes les 5 minutes</text>
  <line x1="310" y1="360" x2="400" y2="360" class="arrow"/><line x1="670" y1="360" x2="750" y2="360" class="arrow"/><line x1="1020" y1="360" x2="1100" y2="360" class="arrow"/><line x1="1370" y1="360" x2="1450" y2="360" class="arrow"/>
  <g transform="translate(60 250)"><rect width="250" height="220" rx="8" class="box"/><text x="28" y="62" class="h">Gmail</text><text x="28" y="108" class="b">Emails +</text><text x="28" y="135" class="b">pièces jointes</text><text x="28" y="177" class="b">Libellés de résultat</text></g>
  <g transform="translate(400 250)"><rect width="270" height="220" rx="8" class="hot"/><text x="28" y="62" class="h">n8n local</text><text x="28" y="108" class="b">Déduplication</text><text x="28" y="145" class="b">Orchestration</text><text x="28" y="172" class="b">+ erreurs</text></g>
  <g transform="translate(750 250)"><rect width="270" height="220" rx="8" class="box"/><text x="28" y="62" class="h">Airtable</text><text x="28" y="108" class="b">Clients · Mails</text><text x="28" y="135" class="b">· Fichiers</text><text x="28" y="177" class="b">Relations + rollups</text></g>
  <g transform="translate(1100 250)"><rect width="270" height="220" rx="8" class="box"/><text x="28" y="62" class="h">Drive</text><text x="28" y="108" class="b">Un dossier par client</text><text x="28" y="150" class="b">Liens vers les fichiers</text></g>
  <g transform="translate(1450 250)"><rect width="270" height="220" rx="8" class="box"/><text x="28" y="62" class="h">Interface</text><text x="28" y="108" class="b">Recherche</text><text x="28" y="150" class="b">Lecture seule</text></g>
  <rect x="400" y="565" width="970" height="110" rx="8" fill="#F7F7F7" stroke="#B8BCC4"/>
  <text x="440" y="615" class="h">Principe de robustesse</text><text x="440" y="650" class="b">Un échec d’upload reste traçable dans Airtable sans bloquer les autres pièces jointes.</text>
  <text x="70" y="745" class="sub">Stack : n8n Community 2.6.4 · Airtable · Google Drive · Gmail</text>
</svg>
